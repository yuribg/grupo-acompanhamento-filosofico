<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grupo de Acompanhamento Filosófico</title>
    <link rel="icon" type="image/png" href="./imagens/acropole.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#login-button">Pular para o login</a>

    <main id="conteudo" class="login-screen" aria-label="Tela de login do site">
        <div class="login-container">
            <div class="login-box">
                <img src="./imagens/acropole.png" alt="Símbolo da Acrópole" class="login-logo">
                <h1>Grupo de Acompanhamento Filosófico</h1>
                <p class="login-subtitle">Acesse com sua conta institucional</p>

                <button id="login-button" type="button" class="login-button">
                    <svg class="login-button-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M10 17l5-5-5-5v3H3v4h7v3zm9-14H5a2 2 0 0 0-2 2v3h2V5h14v14H5v-3H3v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
                    </svg>
                    <span id="login-button-label">Entrar com o Login Acrópole</span>
                </button>
                <p id="login-error" class="login-error" role="alert" aria-live="assertive" hidden></p>
            </div>
        </div>
    </main>

<script src="auth.js"></script>
<script>
    initializeLoginPage();
</script>

</body>
</html>
